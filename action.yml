# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

name: "Hyperlight Workflow Setup"
description: "Common setup steps for GitHub workflows in the Hyperlight project"

inputs:
  additional-toolchain-directory:
    description: "Optional directory containing another Rust toolchain file."
    required: false
  just-version:
    description: '(Default: 1.41) Version of just to install.'
    required: false
    default: '1.41'
runs:
  using: composite
  steps:

    - name: Ensure Homebrew is available (macOS)
      if: ${{ runner.os == 'macOS' }}
      run: |
        find_brew() {
          local candidate
          if candidate="$(command -v brew)" && [ -x "$candidate" ]; then
            echo "$candidate"
            return 0
          fi
          for candidate in /opt/homebrew/bin/brew /usr/local/bin/brew; do
            if [ -x "$candidate" ]; then
              echo "$candidate"
              return 0
            fi
          done
          return 1
        }

        brew_is_writable() {
          prefix="$("$brew" --prefix)" || return 1
          repository="$("$brew" --repository)" || return 1
          if [ ! -O "$repository" ]; then
            echo "Homebrew repository is not owned by $(id -un): $repository" >&2
            return 1
          fi
          for directory in "$prefix" "$repository" \
              "$prefix/Cellar" "$prefix/Frameworks" "$prefix/bin" \
              "$prefix/etc" "$prefix/etc/bash_completion.d" \
              "$prefix/include" "$prefix/lib" "$prefix/lib/pkgconfig" \
              "$prefix/opt" "$prefix/sbin" "$prefix/share" \
              "$prefix/share/doc" "$prefix/share/man" \
              "$prefix/share/man/man1" "$prefix/share/man/man3" \
              "$prefix/share/man/man5" "$prefix/share/man/man7" \
              "$prefix/share/zsh" "$prefix/share/zsh/site-functions" \
              "$prefix/var/homebrew" "$prefix/var/homebrew/linked" \
              "$prefix/var/homebrew/locks"; do
            if [ -e "$directory" ] && [ ! -w "$directory" ]; then
              echo "Homebrew directory is not writable: $directory" >&2
              return 1
            fi
          done
        }

        if ! brew="$(find_brew)" || ! brew_is_writable; then
          echo "Installing or repairing Homebrew for $(id -un)."
          installer="$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          NONINTERACTIVE=1 /bin/bash -c "$installer"
          if ! brew="$(find_brew)"; then
            echo "::error::Homebrew installer completed but brew was not found."
            exit 1
          fi
        fi

        if ! brew_is_writable; then
          echo "::error::Homebrew is still not writable after running its installer. Check runner sudo permissions and Homebrew ownership."
          exit 1
        fi

        prefix="$("$brew" --prefix)"
        printf '%s\n' "$prefix/bin" "$prefix/sbin" >> "$GITHUB_PATH"
      shell: bash

    - name: Preserve development debug information
      run: |
        if [ -z "${CARGO_PROFILE_DEV_DEBUG+x}" ]; then
          echo "CARGO_PROFILE_DEV_DEBUG=2" >> "$GITHUB_ENV"
        fi
      shell: bash

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      with:
        cache: 'false'
        matcher: 'false'
        build-warnings: ''

    - name: Install additional Rust toolchain
      if: ${{ inputs.additional-toolchain-directory != '' }}
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      with:
        rust-src-dir: ${{ inputs.additional-toolchain-directory }}
        cache: 'false'
        matcher: 'false'
        build-warnings: ''

    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      with:
        just-version: ${{ inputs.just-version }}

    ### Linux setup ###

    - name: Install clang-tools (Linux mariner)
      if: ${{ (runner.os == 'Linux') }}
      run: |
        if command -v dnf > /dev/null 2>&1; then
          if command -v clang > /dev/null 2>&1; then
            echo "clang already installed"
          else
            sudo dnf remove clang -y || true
            sudo dnf install clang -y
            sudo dnf install clang-tools-extra -y
          fi
          if command -v lld > /dev/null 2>&1; then
            echo "lld already installed"
          else
            sudo dnf remove lld -y || true
            sudo dnf install lld -y
          fi
          clang --version
          ld.lld --version
        fi
      shell: bash

    - name: Install clang-tools (Linux ubuntu)
      if: ${{ (runner.os == 'Linux') }}
      run: |
        if command -v apt > /dev/null 2>&1; then
          if [ -d "/usr/lib/llvm-18" ]; then
            echo "clang 18 and llvm 18 already installed"
          else
            wget https://apt.llvm.org/llvm.sh 
            chmod +x ./llvm.sh
            sudo ./llvm.sh 18 clang clang-tools-extra
          fi

          if [ -f /usr/lib/llvm-18/bin/clang ]; then
            if [ ! -L /usr/bin/clang ]; then
                sudo ln -s /usr/lib/llvm-18/bin/clang /usr/bin/clang
            else
                echo "clang already linked"
            fi 
          else
            echo "Error: /usr/lib/llvm-18/bin/clang does not exist."
            exit 1
          fi

          if [ -f /usr/lib/llvm-18/bin/ld.lld ]; then
            if [ ! -L /usr/bin/ld.lld ]; then
                sudo ln -s /usr/lib/llvm-18/bin/ld.lld /usr/bin/ld.lld
            else
                echo "ld.lld already linked"
            fi 
          else
            echo "Error: /usr/lib/llvm-18/bin/ld.lld does not exist."
            exit 1
          fi
          clang --version
          ld.lld --version
        fi
      shell: bash

    - name: Set up env vars (Linux)
      if: ${{ (runner.os == 'Linux') }}
      run: |
        set -x
        if command -v dnf > /dev/null 2>&1; then
          echo "Detected mariner / hyperv"
          ls -al /dev/mshv
        else
          echo "Detected Ubuntu / kvm"
          sudo ls -al /dev/kvm
        fi
        whoami
        groups
        echo "RUST_BACKTRACE=full" >> $GITHUB_ENV
      shell: bash

    ### Windows setup ###

    - name: Enable WHP on Windows
      if: ${{ (runner.os == 'Windows') }}
      run:  Enable-WindowsOptionalFeature -Online -FeatureName HyperVisorPlatform
      shell: pwsh

    - name: Set up env vars (Windows)
      if: ${{ (runner.os == 'Windows') }}
      run: |
        echo "RUST_BACKTRACE=full" >> $GITHUB_ENV
      shell: pwsh
